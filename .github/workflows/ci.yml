name: Windows CI

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 / ${{ matrix.runtime }}
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runtime: [cpu, cu130]
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      BUILD_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          architecture: x64

      - name: Generate application version from tag
        run: |
          python -B tools/release_support.py --tag $env:BUILD_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Invalid release tag' }

      - name: Install build environment
        run: ./tools/setup_environment.ps1 -Python python -Runtime '${{ matrix.runtime }}'

      - name: Generate test-only architecture weights
        run: |
          & ./.venv/Scripts/python.exe -B ./tools/create_ci_models.py --output ./build/ci-models
          if ($LASTEXITCODE -ne 0) { throw 'Fixture generation failed' }

      - name: Build, exercise source and EXE, package and verify ZIP
        run: ./build.ps1 -Runtime '${{ matrix.runtime }}' -Release -Verify -TestModelDir ./build/ci-models -Tag $env:BUILD_TAG

      - name: Upload portable package and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: UpscaleToolkit-windows-x64-${{ matrix.runtime }}
          path: |
            dist/${{ matrix.runtime }}/*.zip
            dist/${{ matrix.runtime }}/*.sha256
            dist/${{ matrix.runtime }}/release.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload acceptance reports and build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-${{ matrix.runtime }}
          path: |
            artifacts/**/*.json
            artifacts/**/*.log
            build/${{ matrix.runtime }}/metadata/*.json
            build/${{ matrix.runtime }}/pyinstaller/UpscaleToolkit/warn-*.txt
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish tag release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download packages from this run
        shell: pwsh
        run: |
          gh run download $env:GITHUB_RUN_ID --pattern 'UpscaleToolkit-windows-x64-*' --dir packages
          if ($LASTEXITCODE -ne 0) { throw 'Package download failed' }

      - name: Upload assets and publish release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @()
          $version = $null
          foreach ($runtime in @('cpu', 'cu130')) {
            $folder = Join-Path 'packages' "UpscaleToolkit-windows-x64-$runtime"
            $report = Get-Content -LiteralPath (Join-Path $folder 'release.json') -Raw | ConvertFrom-Json
            if ($version -and $version -ne $report.version) { throw 'Package versions differ' }
            if ($report.runtime -ne $runtime -or $report.includes_models) { throw 'Unexpected package manifest' }
            $version = $report.version
            $archive = Join-Path $folder $report.archive
            if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $report.sha256) { throw 'Package checksum mismatch' }
            $manifest = Join-Path 'packages' "release-$runtime.json"
            Copy-Item -LiteralPath (Join-Path $folder 'release.json') -Destination $manifest
            $assets += @($archive, "$archive.sha256", $manifest)
          }
          $tag = $env:GITHUB_REF_NAME
          $tagVersion = $tag -creplace '^v', ''
          if ($version -cne $tagVersion) { throw 'Package version does not match the release tag' }
          $draft = gh release view $tag --json isDraft --jq '.isDraft' 2>$null
          $exists = $LASTEXITCODE -eq 0
          if ($exists -and $draft -eq 'false') {
            Write-Output "Release $tag is already published."
            exit 0
          }
          if (-not $exists) {
            @(
              "Release $tag for commit $env:GITHUB_SHA.",
              '',
              'Includes Windows x64 CPU and CUDA 13.0 packages, SHA-256 checksums and build manifests.',
              'Model weights are not included. Place your models in the model folder.',
              'Both packages passed CPU-based CI acceptance; GPU inference and image quality are not evaluated by this workflow.'
            ) | Set-Content -LiteralPath release-notes.md -Encoding utf8
            gh release create $tag --verify-tag --title "Upscale Toolkit $version" --notes-file release-notes.md --draft
            if ($LASTEXITCODE -ne 0) { throw 'Release draft creation failed' }
          }
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed; draft retained for retry' }
          $prerelease = ($version -split '\+', 2)[0].Contains('-')
          if ($prerelease) {
            gh release edit $tag --draft=false --prerelease --latest=false
          } else {
            gh release edit $tag --draft=false --prerelease=false
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
